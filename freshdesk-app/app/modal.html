<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body class="uw-modal-body">
  <div class="uw-tabs">
    <button class="uw-tab active" data-tab="user">User</button>
    <button class="uw-tab" data-tab="subs">Subscriptions</button>
    <button class="uw-tab" data-tab="pay">Payments</button>
  </div>

  <div id="m-loading" class="uw-muted">Loading customer records…</div>
  <div id="m-error" class="uw-error" style="display:none"></div>

  <div id="tab-user" class="uw-tabpane"></div>
  <div id="tab-subs" class="uw-tabpane" style="display:none"></div>
  <div id="tab-pay" class="uw-tabpane" style="display:none"></div>

  <script src="{{{appclient}}}"></script>
  <script src="scripts/modal.js"></script>
</body>
</html>
